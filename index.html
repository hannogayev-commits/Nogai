<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ногай тили</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F7F3;--surface:#FFFFFF;--line:#D5E3DA;--text:#17332A;--muted:#5F7A6E;--green:#1F9D6B;--green-d:#157650;--gold:#FFB020;--red:#E5484D;--red-bg:#FDE8E8;--ok-bg:#DDF5E8;--locked:#C9D6CE;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A16;--surface:#182822;--line:#2A4037;--text:#E8F3EC;--muted:#8FAA9D;--green:#34C58A;--green-d:#1F9D6B;--red-bg:#3A1D20;--ok-bg:#16382B;--locked:#2F453B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1A16;--surface:#182822;--line:#2A4037;--text:#E8F3EC;--muted:#8FAA9D;--green:#34C58A;--green-d:#1F9D6B;--red-bg:#3A1D20;--ok-bg:#16382B;--locked:#2F453B;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:16px 16px 120px}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo{font-weight:900;font-size:22px;flex:1}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:800;font-size:15px}
.icon{background:var(--surface);border:2px solid var(--line);border-radius:14px;width:42px;height:38px;font-size:18px}
.hero{background:var(--green);color:#fff;border-radius:24px;padding:20px;margin-bottom:22px;display:flex;gap:14px;align-items:center;box-shadow:0 5px 0 var(--green-d)}
.hero .horse{font-size:54px;line-height:1}
.hero h1{margin:0 0 4px;font-size:22px;font-weight:900}
.hero p{margin:0;opacity:.92;font-size:15px}
.note{font-size:13px;color:var(--muted);margin:22px 4px 0;line-height:1.4}
.path{display:flex;flex-direction:column;gap:18px;align-items:center}
.node{width:100%;display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:22px;padding:14px;text-align:left;transition:transform .1s}
.node:active{transform:translateY(3px);border-bottom-width:2px}
.node .ic{width:60px;height:60px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-size:28px;flex:none;box-shadow:0 4px 0 var(--green-d)}
.node.done .ic{background:var(--gold);box-shadow:0 4px 0 #D98E00}
.node.locked{opacity:.55}
.node.locked .ic{background:var(--locked);box-shadow:none}
.node b{display:block;font-size:18px;font-weight:900}
.node span{font-size:14px;color:var(--muted)}
.node:nth-child(even){margin-left:14px;width:calc(100% - 14px)}
.node:nth-child(odd){margin-right:14px;width:calc(100% - 14px)}
.lesson{display:flex;flex-direction:column;min-height:calc(100vh - 40px)}
.lt{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.bar{flex:1;height:16px;background:var(--line);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:10px;transition:width .3s}
.x{background:none;font-size:22px;color:var(--muted);padding:4px 8px}
.q{font-size:14px;color:var(--muted);margin:0 0 6px}
.word{font-size:34px;font-weight:900;margin:0 0 26px}
.opts{display:grid;gap:12px}
.opt{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:16px;font-size:19px;font-weight:800;text-align:left}
.opt.sel{border-color:var(--green);background:var(--ok-bg)}
.opt.right{border-color:var(--green);background:var(--ok-bg)}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.opt[disabled]{cursor:default}
.dock{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:2px solid var(--line)}
.dock.ok{background:var(--ok-bg)}
.dock.bad{background:var(--red-bg)}
.dock .in{max-width:480px;margin:0 auto}
.fb{font-weight:900;font-size:19px;margin-bottom:10px}
.dock.ok .fb{color:var(--green-d)}
.dock.bad .fb{color:var(--red)}
.go{width:100%;background:var(--green);color:#fff;border-radius:16px;padding:15px;font-size:18px;font-weight:900;box-shadow:0 4px 0 var(--green-d)}
.go[disabled]{background:var(--locked);box-shadow:none;color:var(--muted)}
.dock.bad .go{background:var(--red);box-shadow:0 4px 0 #B3262B}
.end{text-align:center;padding-top:40px}
.end .big{font-size:84px}
.end h2{font-size:28px;font-weight:900;margin:10px 0 6px}
.stats{display:flex;gap:12px;justify-content:center;margin:22px 0}
.stat{border:2px solid var(--gold);border-radius:16px;padding:12px 18px;min-width:110px}
.stat b{display:block;font-size:24px;font-weight:900}
.stat span{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// ====== СЛОВА: добавляйте сюда. [ногайский, русский] ======
var LESSONS=[
{t:"Привет и вежливость",ic:"👋",w:[["Салам","Привет"],["Рахмет","Спасибо"],["Яхшы","Хорошо"],["Яман","Плохо"],["Йок","Нет"]]},
{t:"Семья",ic:"👪",w:[["Ана","Мама"],["Ата","Папа"],["Ул","Сын"],["Кыз","Дочь"],["Бала","Ребёнок"],["Атай","Дедушка"],["Апте","Старшая сестра"],["Хатын","Жена"]]},
{t:"Числа 1-10",ic:"🔢",w:[["Бир","Один"],["Эки","Два"],["Уьш","Три"],["Доьрт","Четыре"],["Бес","Пять"],["Алты","Шесть"],["Ети","Семь"],["Сегиз","Восемь"],["Тогыз","Девять"],["Он","Десять"]]},
{t:"Еда и питьё",ic:"🍞",w:[["Сув","Вода"],["Оьтпек","Хлеб"],["Эт","Мясо"],["Суьт","Молоко"],["Шай","Чай"],["Туз","Соль"],["Алма","Яблоко"]]},
{t:"Дом и город",ic:"🏠",w:[["Уьй","Дом"],["Эсик","Дверь"],["Терезе","Окно"],["Йол","Дорога"],["Кала","Город"],["Авыл","Село"]]},
{t:"Природа",ic:"🌿",w:[["Ай","Луна"],["Ер","Земля"],["Кар","Снег"],["Орман","Лес"],["От","Огонь"]]},
{t:"Животные",ic:"🐎",w:[["Ат","Лошадь"],["Ийт","Собака"],["Мысык","Кошка"],["Сыйыр","Корова"],["Боьри","Волк"]]},
{t:"Цвета и качества",ic:"🎨",w:[["Ак","Белый"],["Кара","Чёрный"],["Кызыл","Красный"],["Янъы","Новый"],["Аруьв","Красивый"],["Кишкей","Маленький"]]},
{t:"Время",ic:"⏰",w:[["Куьн","День"],["Туьн","Ночь"],["Эртенъ","Утро"],["Кеш","Вечер"],["Йыл","Год"],["Бугуьн","Сегодня"],["Эртен","Завтра"]]},
{t:"Тело",ic:"🖐️",w:[["Кол","Рука"],["Бас","Голова"],["Коьз","Глаз"],["Аяк","Нога"],["Юрек","Сердце"]]},
{t:"Действия",ic:"🗣️",w:[["Барув","Идти"],["Окув","Читать"],["Язув","Писать"],["Ишуьв","Пить"],["Ислев","Работать"]]},
{t:"Фразы: быт",ic:"💬",w:[["Рахмет сизге","Спасибо вам"],["Сав болынъыз","Будьте здоровы"],["Шай ишуьв","Пить чай"],["Койы шай","Крепкий чай"],["Ак оьтпек","Белый хлеб"],["Агаш уьй","Деревянный дом"],["Кар явады","Идёт снег"],["Бугуьн эртенликте","Сегодня утром"]]},
{t:"Фразы: описания",ic:"✨",w:[["Аруьв адем","Красивый человек"],["Аруьв тавыс","Красивый голос"],["Янъы кийим","Новая одежда"],["Толы ай","Полная луна"],["Онъ кол","Правая рука"],["Сол кол","Левая рука"],["Терен туьн","Глубокая ночь"],["Доьрт кере","Четыре раза"]]}
];
var ALL=[];LESSONS.forEach(function(l,li){l.w.forEach(function(w){ALL.push([w[0],w[1],li])})});
function sc(x,ci,a,li){var s=0,t=x[ci];if(x[2]===li)s+=3;if(t.charAt(0).toLowerCase()===a.charAt(0).toLowerCase())s+=2;return s-Math.abs(t.length-a.length)*0.3}
var S={xp:0,streak:0,last:"",done:[]};
try{var raw=localStorage.getItem("nog_state");if(raw)S=JSON.parse(raw)}catch(e){}
function save(){try{localStorage.setItem("nog_state",JSON.stringify(S))}catch(e){}}
function today(d){d=d||new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function yest(){var d=new Date();d.setDate(d.getDate()-1);return today(d)}
if(S.last&&S.last!==today()&&S.last!==yest()){S.streak=0}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var app=document.getElementById("app");
// ===== тема =====
var root=document.documentElement;
try{var th=localStorage.getItem("nog_theme");if(th)root.setAttribute("data-theme",th)}catch(e){}
function isDark(){var a=root.getAttribute("data-theme");return a?a==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function toggleTheme(){var n=isDark()?"light":"dark";root.setAttribute("data-theme",n);try{localStorage.setItem("nog_theme",n)}catch(e){}home()}
// ===== главный экран =====
function home(){
 var h='<div class="top"><div class="logo">🐎 Ногай тили</div><div class="chip">🔥 '+S.streak+'</div><div class="chip">⭐ '+S.xp+'</div><button class="icon" aria-label="Сменить тему" onclick="toggleTheme()">'+(isDark()?"☀️":"🌙")+'</button></div>';
 h+='<div class="hero"><div class="horse">🏇</div><div><h1>Учи ногайский каждый день</h1><p>Один урок — 3 минуты. Не пропускай, и огонь не погаснет.</p></div></div><div class="path">';
 LESSONS.forEach(function(l,i){
  var done=S.done.indexOf(i)>-1,open=i===0||S.done.indexOf(i-1)>-1;
  h+='<button class="node'+(done?" done":"")+(open?"":" locked")+'" '+(open?'onclick="start('+i+')"':"disabled")+'><div class="ic">'+(open?l.ic:"🔒")+'</div><div><b>'+l.t+'</b><span>'+(done?"Пройдено · повторить":open?l.w.length+" слов · новые карточки":"Сначала пройди предыдущий")+'</span></div></button>';
 });
 h+='</div><p class="note">Слова взяты из русско-ногайского словаря А. Баскакова (1956), написание как в словаре. Перед выходом покажи их носителю.</p>';
 app.innerHTML=h;
}
// ===== урок =====
var L=null;
function start(i){
 var ws=shuffle(LESSONS[i].w).slice(0,6),qs=[];
 // каждое слово спрашиваем в обе стороны
 ws.forEach(function(w){qs.push({w:w,dir:0});qs.push({w:w,dir:1})});
 qs=shuffle(qs).map(function(q){
  var ci=q.dir===0?1:0,a=q.w[ci],pool=shuffle(ALL.filter(function(x){return x[ci]!==a})).sort(function(x,y){return sc(y,ci,a,i)-sc(x,ci,a,i)});
  var seen={},opts=[q.w[ci]];seen[q.w[ci]]=1;
  pool.forEach(function(x){if(opts.length<4&&!seen[x[ci]]){seen[x[ci]]=1;opts.push(x[ci])}});
  q.ans=q.w[ci];q.opts=shuffle(opts);return q});
 L={i:i,qs:qs,n:0,sel:null,checked:false,ok:0};
 var h='<div class="lt"><button class="x" aria-label="Назад" onclick="home()">✕</button><div class="logo">'+LESSONS[i].t+'</div></div><div class="opts">';
 LESSONS[i].w.forEach(function(w){h+='<div class="opt"><b>'+w[0]+'</b> — '+w[1]+'</div>'});
 h+='</div><div class="dock"><div class="in"><button class="go" onclick="draw()">Начать урок</button></div></div>';
 app.innerHTML=h;
}
function draw(){
 var q=L.qs[L.n],pct=Math.round(L.n/L.qs.length*100);
 var h='<div class="lesson"><div class="lt"><button class="x" aria-label="Выйти" onclick="home()">✕</button><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
 h+='<p class="q">'+(q.dir===0?"Как переводится это слово?":"Выбери слово на ногайском")+'</p><p class="word">'+q.w[q.dir]+'</p><div class="opts">';
 q.opts.forEach(function(o,k){
  var c="opt";
  if(L.checked){if(o===q.ans)c+=" right";else if(o===L.sel)c+=" wrong"}
  else if(o===L.sel)c+=" sel";
  h+='<button class="'+c+'" '+(L.checked?"disabled":"")+' onclick="pick('+k+')">'+o+'</button>';
 });
 h+='</div></div>';
 var good=L.checked&&L.sel===q.ans;
 h+='<div class="dock'+(L.checked?(good?" ok":" bad"):"")+'"><div class="in">';
 if(L.checked)h+='<div class="fb">'+(good?"Верно!":"Правильно: "+q.ans)+'</div>';
 h+='<button class="go" '+(L.sel===null?"disabled":"")+' onclick="'+(L.checked?"next()":"check()")+'">'+(L.checked?"Дальше":"Проверить")+'</button></div></div>';
 app.innerHTML=h;
}
function pick(k){if(L.checked)return;L.sel=L.qs[L.n].opts[k];draw()}
function check(){L.checked=true;if(L.sel===L.qs[L.n].ans)L.ok++;else L.qs.push(L.qs[L.n]);draw()}
function next(){
 L.n++;L.sel=null;L.checked=false;
 if(L.n>=L.qs.length)finish();else draw();
}
function finish(){
 var gain=10+L.ok*2;S.xp+=gain;
 if(S.last!==today()){S.streak=(S.last===yest())?S.streak+1:1;S.last=today()}
 if(S.done.indexOf(L.i)<0)S.done.push(L.i);
 save();
 app.innerHTML='<div class="end"><div class="big">🎉</div><h2>Урок пройден!</h2><p style="color:var(--muted)">'+LESSONS[L.i].t+'</p><div class="stats"><div class="stat"><b>+'+gain+'</b><span>очков</span></div><div class="stat"><b>🔥 '+S.streak+'</b><span>дней подряд</span></div></div></div><div class="dock"><div class="in"><button class="go" onclick="home()">Продолжить</button></div></div>';
}
home();
</script>
</body>
</html>
