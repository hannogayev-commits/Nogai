<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ногай тили</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--surface:#FFFFFF;--line:#E5E5E5;--text:#3C3C3C;--muted:#777777;--green:#1F9D6B;--green-d:#157650;--gold:#FFB020;--red:#E5484D;--red-bg:#FDE8E8;--ok-bg:#DDF5E8;--locked:#E5E5E5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-theme="dark"]{--bg:#242424;--surface:#2F2F2F;--line:#454545;--text:#EDEDED;--muted:#A0A0A0;--green:#34C58A;--green-d:#1F9D6B;--red-bg:#4A2B2D;--ok-bg:#24402F;--locked:#3A3A3A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:16px 16px 120px}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo{font-weight:900;font-size:22px;flex:1}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:800;font-size:15px}
.icon{background:var(--surface);border:2px solid var(--line);border-radius:14px;width:42px;height:38px;font-size:18px}
.lesson{display:flex;flex-direction:column;min-height:calc(100vh - 40px)}
.lt{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.bar{flex:1;height:16px;background:var(--line);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:10px;transition:width .3s}
.x{background:none;font-size:22px;color:var(--muted);padding:4px 8px}
.q{font-size:14px;color:var(--muted);margin:0 0 6px}
.word{font-size:34px;font-weight:900;margin:0 0 26px}
.opts{display:grid;gap:12px}
.opt{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:16px;font-size:19px;font-weight:800;text-align:left}
.opt.sel{border-color:var(--green);background:var(--ok-bg)}
.opt.right{border-color:var(--green);background:var(--ok-bg)}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.opt[disabled]{cursor:default}
.dock{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:2px solid var(--line)}
.dock.ok{background:var(--ok-bg)}
.dock.bad{background:var(--red-bg)}
.dock .in{max-width:480px;margin:0 auto}
.fb{font-weight:900;font-size:19px;margin-bottom:10px}
.dock.ok .fb{color:var(--green-d)}
.dock.bad .fb{color:var(--red)}
.go{width:100%;background:var(--green);color:#fff;border-radius:16px;padding:15px;font-size:18px;font-weight:900;box-shadow:0 4px 0 var(--green-d)}
.go[disabled]{background:var(--locked);box-shadow:none;color:var(--muted)}
.dock.bad .go{background:var(--red);box-shadow:0 4px 0 #B3262B}
.end{text-align:center;padding-top:40px}
.end .big{font-size:84px}
.end h2{font-size:28px;font-weight:900;margin:10px 0 6px}
.stats{display:flex;gap:12px;justify-content:center;margin:22px 0}
.stat{border:2px solid var(--gold);border-radius:16px;padding:12px 18px;min-width:110px}
.stat b{display:block;font-size:24px;font-weight:900}
.stat span{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.unit{margin:30px 0 14px;background:var(--green);color:#fff;border-radius:16px;padding:12px 16px;font-weight:900;font-size:18px}
.lv{display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;margin:12px auto}
.lvb{width:76px;height:76px;border-radius:50%;background:var(--green);color:#fff;font-size:30px;box-shadow:0 6px 0 var(--green-d);display:grid;place-items:center}
.lvb:active{transform:translateY(4px);box-shadow:0 2px 0 var(--green-d)}
.lvb.done{background:var(--gold);box-shadow:0 6px 0 #D98E00}
.lvb.lock{background:var(--locked);box-shadow:0 6px 0 var(--line);color:var(--muted);cursor:default}
.tip{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-weight:900;color:var(--green);font-size:13px}
.chips{min-height:62px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0;margin-bottom:18px}
.chips.bank{border:0}
.tile{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:10px 14px;font-weight:800;font-size:18px;color:var(--text)}
.tile.ghost{background:var(--line);border-color:var(--line);min-width:56px;height:46px;opacity:.5}
.st{color:var(--gold);font-size:14px;letter-spacing:2px;margin-top:-2px}
.prac{width:100%;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:12px;font-weight:900;font-size:16px;color:var(--green)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
var U=[

"Числа 1-10#🔢#бир=Один,эки=Два,уьш=Три,доьрт=Четыре,бес=Пять,алты=Шесть,ети=Семь,сегиз=Восемь,тогыз=Девять,он=Десять",
"Семья и люди#👪#ана=Мама,ата=Папа,ул=Сын,кыз=Дочь,бала=Ребёнок,кардаш=Брат,синъли=Сестра,атай=Дедушка,бай=Муж,хатын=Жена,адем=Человек,хатын-кыз=Женщина",
"Еда#🍞#оьтпек=Хлеб,эт=Мясо,туз=Соль,секер=Сахар,май=Масло,пыслак=Сыр,бал=Мёд,балык=Рыба,алма=Яблоко",
"Питьё и вкус#🍵#сув=Вода,суьт=Молоко,шай=Чай,таьтли=Сладкий,ашшы=Горький,тузлы=Солёный,исси=Горячий,сувык=Холодный#Крепкий чай=койы шай",
"Дом#🏠#уьй=Дом,эсик=Дверь,терезе=Окно,ашкыш=Ключ,пышак=Нож,касык=Ложка,тепшек=Тарелка,шырак=Лампа#Деревянный дом=агаш уьй",
"Тело#🖐️#бас=Голова,кол=Рука,аяк=Нога,коьз=Глаз,кулак=Ухо,бурын=Нос,авыз=Рот,тис=Зуб,юрек=Сердце,арка=Спина,шырай=Лицо,бармак=Палец#Правая рука=онъ кол;Левая рука=сол кол;Острый глаз=оьткир коьз;Сердце бьётся=юрек согады;Доброе сердце=юмсак юрек",
"Цвета#🎨#кызыл=Красный,ак=Белый,кара=Чёрный,коьк=Синий,сары=Жёлтый,куба=Серый,туьс=Цвет#Белый хлеб=ак оьтпек;Чёрный хлеб=кара оьтпек",
"Домашние животные#🐎#ат=Лошадь,ийт=Собака,мысык=Кошка,сыйыр=Корова,эшки=Коза,оьгиз=Бык,эшек=Осёл#Верховая лошадь=минилетаган ат;Старая лошадь=карт ат",
"Дикие животные#🐺#боьри=Волк,туьлки=Лиса,аюв=Медведь,коян=Заяц,карагус=Орёл,йылан=Змея",
"Небо и погода#☀️#куьн коьзи=Солнце,ай=Луна,юлдыз=Звезда,ел=Ветер,кар=Снег,булыт=Облако#Полная луна=толы ай;Солнечный день=шуваклы куьн;Пасмурный день=булытлы куьн;Солнце село=куьн батты",
"Земля и вода#🏔️#ер=Земля,йылга=Река,коьл=Озеро,тенъиз=Море,тав=Гора,орман=Лес,данъыл=Степь,оьлен=Трава,терек=Дерево,тас=Камень,от=Огонь#Густой лес=койы орман;Снежные горы=карлы тавлар;Леса и воды=орманлар эм сувлар",
"Числа 20-1000#💯#йырма=Двадцать,отыз=Тридцать,кырк=Сорок,элли=Пятьдесят,етпис=Семьдесят,сексен=Восемьдесят,токсан=Девяносто,юз=Сто,мынъ=Тысяча",
"День и ночь#🌙#куьн=День,туьн=Ночь,эртенъ=Утро,кеш=Вечер,бугуьн=Сегодня,эртен=Завтра,туьнегуьн=Вчера,саат=Час,юма=Неделя#Глубокая ночь=терен туьн;Сегодня вечером=бугуьн кеште;Ранним утром=эрте эртенъликте;По утрам=эртенълик сайын",
"Год и сезоны#🍂#йыл=Год,язлык=Весна,яз=Лето,куьз=Осень",
"Размер#📏#уьйкен=Большой,кишкей=Маленький,узын=Длинный,кыска=Короткий,бийик=Высокий,йенъ=Широкий,тар=Узкий,юка=Тонкий#Маленький рост=кишкей бой",
"Качества#✨#янъы=Новый,карт=Старый,аруьв=Красивый,тез=Быстрый,йылы=Тёплый,куьшли=Сильный,енъил=Лёгкий,авыр=Тяжёлый#Красивый вид=ярасык коьринис",
"Одежда#👕#кийим=Одежда,боьрк=Шапка,белбав=Пояс,явлык=Платок,аяк кийим=Обувь#Белый платок=ак явлык",
"Город и село#🏘️#кала=Город,авыл=Село,орам=Улица,йол=Дорога,коьпир=Мост,базар=Рынок,кайык=Лодка",
"Движение#🚶#барув=Идти,келуьв=Прийти,турув=Стоять,олтырув=Сидеть,ятув=Лежать#Идти вперёд=алдыга барув;Он идёт быстро=ол тез юреди",
"Действия#🛠️#ашав=Есть,ишуьв=Пить,уйклав=Спать,ислев=Работать,ойнав=Играть,окув=Читать,язув=Писать#Он часто пишет матери=ол анасына тез-тез язады",
"Ум и речь#🗣️#тынълав=Слушать,коьруьв=Смотреть,билуьв=Знать,ойлав=Думать,анълав=Понимать,йырлав=Петь#Петь песню=йыр йырлав;Знать урок=урогин билуьв",
"Дать и взять#🤝#беруьв=Дать,алув=Взять,ашув=Открыть,ябув=Закрыть,яшав=Жить,карай турув=Ждать#Открыть дверь=эсикти ашув;Дать взаймы=борышка беруьв",
"Где и сколько#📍#ювык=Близко,узак=Далеко,коьп=Много,аьр заман=Всегда,бек=Очень,бирге=Вместе#Друг за другом=бириннен сонъ бири;Друг против друга=бири бирине карсы",
"Язык и народ#📚#тил=Язык,йыр=Песня,окувшы=Ученик,халк=Народ,уьйленуьв тойы=Свадьба"
];
var LESSONS=U.map(function(s){var p=s.split("#");return{t:p[0],ic:p[1],w:p[2].split(",").map(function(x){return x.split("=")}),ph:p[3]?p[3].split(";").map(function(x){return x.split("=")}):[]}});
var ALL=[],PW=[];
LESSONS.forEach(function(l,li){l.w.forEach(function(w){ALL.push([w[0],w[1],li])});l.ph.forEach(function(p){PW=PW.concat(p[1].split(" "))})});
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function sc(x,ci,a,li){var s=0,t=x[ci];if(x[2]===li)s+=3;if(t.charAt(0).toLowerCase()===a.charAt(0).toLowerCase())s+=2;return s-Math.abs(t.length-a.length)*0.3}
var LEVELS=[];
LESSONS.forEach(function(l,li){var n=l.w.length,c=Math.ceil(n/3);for(var j=0;j<c;j++)LEVELS.push({u:li,kind:"new",ws:l.w.slice(Math.round(j*n/c),Math.round((j+1)*n/c))});if(l.ph.length)LEVELS.push({u:li,kind:"phr",ph:l.ph});LEVELS.push({u:li,kind:"review"})});
var S={xp:0,streak:0,last:"",n:0,st:{}};
try{var raw=localStorage.getItem("nog_state");if(raw){var o=JSON.parse(raw);S.xp=o.xp||0;S.streak=o.streak||0;S.last=o.last||"";S.n=o.n||0;S.st=o.st||{}}}catch(e){}
function save(){try{localStorage.setItem("nog_state",JSON.stringify(S))}catch(e){}}
function today(d){d=d||new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function yest(){var d=new Date();d.setDate(d.getDate()-1);return today(d)}
if(S.last&&S.last!==today()&&S.last!==yest())S.streak=0;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var app=document.getElementById("app"),root=document.documentElement;
try{if(localStorage.getItem("nog_theme")==="dark")root.setAttribute("data-theme","dark")}catch(e){}
function isDark(){return root.getAttribute("data-theme")==="dark"}
function toggleTheme(){var n=isDark()?"light":"dark";if(n==="dark")root.setAttribute("data-theme","dark");else root.removeAttribute("data-theme");try{localStorage.setItem("nog_theme",n)}catch(e){}home()}
function home(){
 var h='<div class="top"><div class="logo">🐎 Ногай тили</div><div class="chip">🔥 '+S.streak+'</div><div class="chip">⭐ '+S.xp+'</div><button class="icon" aria-label="Сменить тему" onclick="toggleTheme()">'+(isDark()?"☀️":"🌙")+'</button></div>';
 if(S.n>=3)h+='<button class="prac" onclick="practice()">🔁 Тренировка: повтори выученное</button>';
 LEVELS.forEach(function(v,i){
  if(i===0||LEVELS[i-1].u!==v.u)h+='<div class="unit">Раздел '+(v.u+1)+' · '+LESSONS[v.u].t+'</div>';
  var cur=i===S.n,lock=i>S.n,x=Math.round(Math.sin(i*0.9)*54);
  h+='<div class="lv" style="transform:translateX('+x+'px)">'+(cur?'<div class="tip">НАЧАТЬ</div>':'')+'<button class="lvb'+(i<S.n?" done":"")+(lock?" lock":"")+'" '+(lock?'disabled aria-label="Закрыто"':'onclick="start('+i+')" aria-label="Уровень '+(i+1)+'"')+'>'+(lock?"🔒":i<S.n?"✓":v.kind==="review"?"⭐":v.kind==="phr"?"💬":LESSONS[v.u].ic)+'</button>'+(i<S.n?'<div class="st">'+"★".repeat(S.st[i]||1)+'</div>':'')+'</div>';
 });
 app.innerHTML=h;
 var c=document.querySelector(".lvb:not(.done):not(.lock)");if(c&&c.scrollIntoView)c.scrollIntoView({block:"center"});
}
var L=null;
function start(i){begin(LEVELS[i],i)}
function practice(){var ws=[];for(var i=0;i<S.n&&i<LEVELS.length;i++)if(LEVELS[i].kind==="new")ws=ws.concat(LEVELS[i].ws);if(ws.length>=4)begin({u:-1,kind:"mix",ws:shuffle(ws).slice(0,8)},-1)}
function begin(v,i){
 var qs=[],mix=v.kind==="mix",ws;
 if(v.kind==="phr"){
  shuffle(v.ph).slice(0,5).forEach(function(p){
   var w2=p[1].split(" "),ex=shuffle(PW.filter(function(x){return w2.indexOf(x)<0})).filter(function(x,k,a){return a.indexOf(x)===k}).slice(0,2);
   qs.push({tile:1,ru:p[0],ans:p[1],tiles:shuffle(w2.concat(ex))})});
 }else{
  ws=(v.kind==="review")?shuffle(LESSONS[v.u].w).slice(0,6):v.ws;
  ws.forEach(function(w){qs.push({w:w,dir:0});qs.push({w:w,dir:1});if(!mix)qs.push({w:w,dir:Math.round(Math.random())})});
  qs=shuffle(qs).map(function(q){
   var ci=q.dir===0?1:0,a=q.w[ci],pool=shuffle(ALL.filter(function(x){return x[ci]!==a})).sort(function(x,y){return sc(y,ci,a,v.u)-sc(x,ci,a,v.u)});
   var seen={},opts=[a];seen[a]=1;
   pool.forEach(function(x){if(opts.length<4&&!seen[x[ci]]){seen[x[ci]]=1;opts.push(x[ci])}});
   q.ans=a;q.opts=shuffle(opts);return q});
 }
 L={i:i,v:v,qs:qs,n:0,sel:qs[0].tile?[]:null,checked:false,ok:0,miss:0};
 if(v.kind!=="new"&&v.kind!=="phr"){draw();return}
 var h='<div class="lt"><button class="x" aria-label="Назад" onclick="home()">✕</button><div class="logo">'+LESSONS[v.u].t+'</div></div><p class="q">'+(v.kind==="phr"?"Новые фразы":"Новые слова")+'</p><div class="opts">';
 if(v.kind==="phr")v.ph.forEach(function(p){h+='<div class="opt"><b>'+cap(p[1])+'</b><br>'+p[0]+'</div>'});
 else v.ws.forEach(function(w){h+='<div class="opt"><b>'+cap(w[0])+'</b> — '+w[1]+'</div>'});
 app.innerHTML=h+'</div><div class="dock"><div class="in"><button class="go" onclick="draw()">Начать</button></div></div>';
}
function okq(q){return q.tile?L.sel.map(function(k){return q.tiles[k]}).join(" ")===q.ans:L.sel===q.ans}
function draw(){
 var q=L.qs[L.n],pct=Math.round(L.n/L.qs.length*100);
 var h='<div class="lesson"><div class="lt"><button class="x" aria-label="Выйти" onclick="home()">✕</button><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
 if(q.tile){
  h+='<p class="q">Составь предложение на ногайском</p><p class="word">'+q.ru+'</p><div class="chips">'+L.sel.map(function(k){return '<button class="tile" '+(L.checked?'disabled':'onclick="untile('+k+')"')+'>'+q.tiles[k]+'</button>'}).join('')+'</div><div class="chips bank">'+q.tiles.map(function(t,k){return L.sel.indexOf(k)<0?'<button class="tile" '+(L.checked?'disabled':'onclick="tile('+k+')"')+'>'+t+'</button>':'<span class="tile ghost"></span>'}).join('')+'</div></div>';
 }else{
  h+='<p class="q">'+(q.dir===0?"Как переводится это слово?":"Выбери слово на ногайском")+'</p><p class="word">'+cap(q.w[q.dir])+'</p><div class="opts">';
  q.opts.forEach(function(o,k){
   var c="opt";
   if(L.checked){if(o===q.ans)c+=" right";else if(o===L.sel)c+=" wrong"}
   else if(o===L.sel)c+=" sel";
   h+='<button class="'+c+'" '+(L.checked?"disabled":"")+' onclick="pick('+k+')">'+cap(o)+'</button>';
  });
  h+='</div></div>';
 }
 var good=L.checked&&okq(q),empty=q.tile?L.sel.length===0:L.sel===null;
 h+='<div class="dock'+(L.checked?(good?" ok":" bad"):"")+'"><div class="in">';
 if(L.checked)h+='<div class="fb">'+(good?"Верно!":"Правильно: "+cap(q.ans))+'</div>';
 h+='<button class="go" '+(empty?"disabled":"")+' onclick="'+(L.checked?"next()":"check()")+'">'+(L.checked?"Дальше":"Проверить")+'</button></div></div>';
 app.innerHTML=h;
}
function pick(k){if(L.checked)return;L.sel=L.qs[L.n].opts[k];draw()}
function tile(k){if(L.checked)return;L.sel.push(k);draw()}
function untile(k){if(L.checked)return;L.sel.splice(L.sel.indexOf(k),1);draw()}
function check(){var q=L.qs[L.n];L.checked=true;if(okq(q))L.ok++;else{L.miss++;L.qs.push(q)}draw()}
function next(){L.n++;if(L.n>=L.qs.length){finish();return}L.sel=L.qs[L.n].tile?[]:null;L.checked=false;draw()}
function finish(){
 var gain=10+L.ok*2,stars=L.miss===0?3:L.miss<=2?2:1;S.xp+=gain;
 if(S.last!==today()){S.streak=(S.last===yest())?S.streak+1:1;S.last=today()}
 if(L.i>=0){if((S.st[L.i]||0)<stars)S.st[L.i]=stars;if(L.i===S.n)S.n++}
 save();
 app.innerHTML='<div class="end"><div class="big">🎉</div><h2>Уровень пройден!</h2><p class="st" style="font-size:30px">'+"★".repeat(stars)+'</p><p style="color:var(--muted)">'+(L.v.u>=0?LESSONS[L.v.u].t:"Тренировка")+'</p><div class="stats"><div class="stat"><b>+'+gain+'</b><span>очков</span></div><div class="stat"><b>🔥 '+S.streak+'</b><span>дней подряд</span></div></div></div><div class="dock"><div class="in"><button class="go" onclick="home()">Продолжить</button></div></div>';
}
home();
</script>
